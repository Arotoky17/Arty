name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt -e ".[dev]"
      - name: Reject new Ruff and mypy errors
        run: python scripts/check_baselines.py check all
      - name: Check SMC strictly on Python 3.11
        run: python -m mypy --python-version 3.11 src/arty_trading/modules/smc/
      - name: Run tests
        run: |
          New-Item -ItemType Directory -Force .quality-cache | Out-Null
          python -m pytest -q -p no:cacheprovider --basetemp .quality-cache/pytest

  baseline-freshness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned quality tools and dependencies
        run: python -m pip install -c requirements-ci.txt -e ".[dev]"
      - name: Regenerate baselines without accepting new errors
        run: python scripts/check_baselines.py sync all
      - name: Reject obsolete baselines
        run: git diff --exit-code -- .ruff-baseline.json mypy-baseline.txt
