services:
  postgres:
    image: postgres:16-alpine
    container_name: arty_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arty
      POSTGRES_PASSWORD: arty_secret
      POSTGRES_DB: arty_trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arty -d arty_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: arty_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    profiles:
      - full

volumes:
  postgres_data:
