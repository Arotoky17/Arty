[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arty"
version = "0.1.0"
description = "Plateforme professionnelle de trading Forex (SMC/ICT + IA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arty" }]
keywords = ["forex", "trading", "smc", "ict", "metatrader5", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "MetaTrader5>=5.0.45",
    "pandas>=2.1.0",
    "numpy>=1.26.0,<2.3",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "websockets>=12.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "python-telegram-bot>=20.7",
    "discord-webhook>=1.3.0",
    "aiosmtplib>=3.0.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.8.0",
    "openai>=1.10.0",
    "pytz>=2024.1",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "mypy-baseline==0.7.4",
]

[project.scripts]
arty = "arty_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "silent"

[tool.mypy-baseline]
baseline_path = "mypy-baseline.txt"
allow_unsynced = true
sort_baseline = true
no_colors = true

[tool.arty-baselines]
ruff = ".ruff-baseline.json"
mypy = "mypy-baseline.txt"

[tool.coverage.run]
source = ["src/arty_trading"]
omit = ["*/tests/*"]
